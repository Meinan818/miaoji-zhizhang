spring:
  application:
    name: miaoji-backend
  config:
    import: optional:file:./.env.local.properties
  datasource:
    url: ${MIAOJI_DB_URL}
    username: ${MIAOJI_DB_USERNAME}
    password: ${MIAOJI_DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
  mail:
    host: ${MIAOJI_SMTP_HOST:smtp.163.com}
    port: ${MIAOJI_SMTP_PORT:465}
    username: ${MIAOJI_SMTP_USERNAME:}
    password: ${MIAOJI_SMTP_AUTHORIZATION:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": true
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
miaoji:
  ai:
    enabled: ${MIAOJI_AI_ENABLED:false}
    api-key: ${MIAOJI_GLM_API_KEY:}
  storage-root: ${MIAOJI_STORAGE_DIR:./storage}
  email:
    enabled: ${MIAOJI_EMAIL_ENABLED:false}
server:
  address: 127.0.0.1
  port: ${MIAOJI_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: MIAOJI_SESSION
        http-only: true
        same-site: lax
        secure: ${MIAOJI_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
